<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>赛道洞察</title>
  <style>
    :root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#667085;--line:#dde3ea;--red:#e2231a;--green:#17865b;--blue:#2563a8;--amber:#9a5a00}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.wrap{max-width:1440px;margin:auto;padding:32px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end}.hero h1{font-size:34px;margin:0 0 8px}.hero p,.muted{color:var(--muted)}.scope{text-align:right;color:var(--muted);font-size:14px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:26px 0}.metric,.panel,.track{background:var(--card);border:1px solid var(--line);border-radius:12px}.metric{padding:18px}.metric b{display:block;font-size:27px}.metric span{font-size:13px;color:var(--muted)}.panel{overflow:hidden}.toolbar{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--line)}input,select{border:1px solid #cbd3dc;border-radius:8px;padding:9px 12px;background:#fff}input{flex:1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#eef1f4;font-size:13px}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.高热度{background:#e5f5ed;color:var(--green)}.活跃{background:#e8f0fa;color:var(--blue)}.观察{background:#fff2dc;color:var(--amber)}.details{margin-top:28px}.track{padding:24px;margin:16px 0}.track-head{display:flex;justify-content:space-between;gap:20px}.track h3{margin:0 0 8px;font-size:23px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}.block h4{margin:0 0 8px;font-size:15px}.block p{margin:0;line-height:1.75}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#eef2f6;border-radius:6px;padding:5px 8px;font-size:13px}.needs td,.needs th{border:1px solid var(--line);padding:9px}.empty{padding:36px;text-align:center;color:var(--muted)}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:18px}.scope{display:none}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="hero"><div><h1>赛道洞察</h1><p id="subtitle"></p></div><div class="scope" id="scope"></div></section>
  <section class="metrics" id="metrics"></section>
  <section class="panel"><div class="toolbar"><input id="search" placeholder="搜索赛道、产品或企业类型"><select id="status"><option value="">全部状态</option><option value="candidate">候选</option><option value="watchlist">观察中</option></select></div><div id="table"></div></section>
  <section class="details"><h2>赛道解读与 SMB 价值</h2><div id="details"></div></section>
</main>
<script>
const DATA=__DASHBOARD_DATA__;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
const chips=v=>arr(v).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
document.getElementById('subtitle').textContent=`${DATA.plan.research_topic||''} · 适合联想 SMB 业务的重点赛道`;
document.getElementById('scope').innerHTML=`${esc(arr(DATA.plan.regions).join('、'))}<br>${esc(DATA.plan.start_date)} 至 ${esc(DATA.plan.end_date)}`;
const labels=[['track_count','赛道'],['candidate_count','候选'],['watchlist_count','观察中'],['topic_count','Topic'],['event_count','Event'],['source_count','来源']];
document.getElementById('metrics').innerHTML=labels.map(([k,l])=>`<div class="metric"><b>${DATA.metrics[k]}</b><span>${l}</span></div>`).join('');
function filtered(){const q=document.getElementById('search').value.trim().toLowerCase(),s=document.getElementById('status').value;return DATA.tracks.filter(t=>(!s||t.status===s)&&(!q||JSON.stringify(t).toLowerCase().includes(q)))}
function render(){const tracks=filtered();document.getElementById('table').innerHTML=tracks.length?`<table><thead><tr><th>序号</th><th>赛道</th><th>热度</th><th>定位</th><th>Event</th><th>来源</th><th>状态</th></tr></thead><tbody>${tracks.map((t,i)=>`<tr><td>${i+1}</td><td><b>${esc(t.name)}</b></td><td><span class="badge ${t.heat}">${t.heat}</span></td><td>${esc(t.definition)}</td><td>${t.event_count}</td><td>${t.source_count}</td><td>${t.status==='candidate'?'候选':'观察中'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有符合条件的赛道</div>';
document.getElementById('details').innerHTML=tracks.map(t=>{const a=t.analysis||{},needs=arr(a.smb_value_analysis),members=arr(t.topic_memberships);return `<article class="track"><div class="track-head"><div><h3>${esc(t.name)}</h3><div class="muted">${esc(t.definition)}</div></div><span class="badge ${t.heat}">${t.heat}</span></div><div class="grid"><div class="block"><h4>企业集合</h4><p>${esc(t.enterprise_archetype)}</p></div><div class="block"><h4>当前价值</h4><p>${esc(a.why_now||'待分析')}</p></div><div class="block"><h4>产品与服务</h4><div class="chips">${chips(t.core_products_services)}</div></div><div class="block"><h4>企业类型</h4><div class="chips">${chips(t.core_company_types)}</div></div><div class="block"><h4>可观察特征</h4><div class="chips">${chips(t.observable_company_features)}</div></div><div class="block"><h4>关联 Topic</h4><div class="chips">${chips(members.map(x=>x.topic_id))}</div></div></div>${needs.length?`<h4>SMB 需求与覆盖路径</h4><table class="needs"><tr><th>经营活动</th><th>工作负载</th><th>IT 需求</th><th>覆盖路径</th></tr>${needs.map(n=>`<tr><td>${esc(n.business_activity)}</td><td>${esc(n.workload)}</td><td>${esc(n.it_need)}</td><td>${esc(n.coverage_path)}</td></tr>`).join('')}</table>`:''}${arr(a.uncertainties).length?`<p class="muted">不确定性：${esc(a.uncertainties.join('；'))}</p>`:''}</article>`}).join('')||'<div class="empty">没有赛道详情</div>'}
document.getElementById('search').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);render();
</script>
</body>
</html>
