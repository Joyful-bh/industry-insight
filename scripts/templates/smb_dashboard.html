<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全国赛道洞察 · 联想 SMB</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#243247;background:#f4f6f9;color-scheme:light;--red:#c41230;--muted:#758096;--line:#e7ebf1}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #bfcdf3;outline-offset:3px}
.topbar{height:62px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1440px)/2));gap:20px}
.brand{font-weight:700;letter-spacing:.04em}.brand em{font-style:normal;color:var(--red);margin-right:14px}.topbar span{color:var(--muted);font-size:12px}
main{max-width:1440px;margin:auto;padding:30px 24px}.eyebrow{font-size:12px;color:var(--red);letter-spacing:.12em;font-weight:bold}h1{font-size:30px;letter-spacing:-.03em;margin:10px 0}p{line-height:1.7;margin:8px 0}h2{margin:0;font-size:23px}h3{font-size:17px;margin:0 0 15px}
.muted{color:var(--muted);font-size:13px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.hero p{font-size:14px;color:#667085}.notice{border:1px solid var(--line);border-radius:10px;background:white;padding:13px 18px;font-size:12px;color:#667085;margin-bottom:22px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.metric{border:1px solid var(--line);background:white;border-radius:12px;padding:20px 22px}.metric small{color:#68758b}.metric b{display:block;font-size:30px;margin:10px 0 5px}.metric span{font-size:12px;color:var(--muted)}
.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.filters{padding:20px;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}input,select{border:1px solid #dce2eb;border-radius:8px;padding:10px 12px;background:white;color:#334155;font-size:13px}#search{flex:1;min-width:240px}.btn{border:1px solid #dce2eb;background:white;border-radius:8px;padding:9px 13px;color:#526277;font-size:13px}.btn:hover{background:#f4f6fa}.results-meta{display:flex;justify-content:space-between;padding:14px 20px;color:var(--muted);font-size:12px}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{background:#f8fafc;color:#6d788b;text-align:left;padding:12px 16px;font-size:12px;font-weight:500;white-space:nowrap}td{padding:17px 16px;border-top:1px solid #eef1f5;vertical-align:middle}tbody tr:hover{background:#fafbfd}.track-name{border:0;background:none;text-align:left;padding:0;font-weight:600;color:#21334d;font-size:15px}.track-name:hover{color:var(--red)}.excerpt{color:#8390a3;font-size:12px;line-height:1.6;margin-top:7px;max-width:470px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rank{color:#94a0b3}.number{font-size:18px;font-variant-numeric:tabular-nums;font-weight:600;color:#30445d}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border-radius:5px;background:#f0f4fa;color:#5b6c84;padding:4px 7px;font-size:11px;display:inline-block}.province{background:#f3f5f8}.badge{display:inline-block;border-radius:5px;padding:5px 8px;background:#ebf5f0;color:#33745c;white-space:nowrap;font-size:11px}.watchlist{background:#fff5e3;color:#98702d}.pager{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-top:1px solid var(--line);gap:10px;font-size:13px;color:var(--muted)}.pager div{display:flex;gap:8px;align-items:center}.empty{padding:50px;text-align:center;color:var(--muted)}
dialog{width:min(1060px,95vw);max-height:90vh;border:0;border-radius:16px;padding:0;box-shadow:0 24px 80px #15263c35;overflow:hidden}dialog::backdrop{background:#15243965;backdrop-filter:blur(3px)}.detail-head{padding:25px 28px 18px;background:white;border-bottom:1px solid var(--line);position:relative}.detail-head h2{padding-right:50px;margin:10px 0}.close{position:absolute;right:22px;top:23px;font-size:23px;border:0;background:#f3f5f8;border-radius:8px;width:34px;height:34px;color:#68758a}.detail-meta{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:12px}.tabs{display:flex;gap:5px;padding:0 25px;border-bottom:1px solid var(--line);overflow:auto}.tabs button{white-space:nowrap;border:0;background:white;padding:15px 14px;color:#7b8799;font-size:13px;border-bottom:2px solid transparent}.tabs button[aria-selected=true]{color:var(--red);border-bottom-color:var(--red);font-weight:600}.detail-body{padding:25px 28px;overflow:auto;max-height:calc(90vh - 190px);min-height:300px;background:#fafbfd}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.definition{font-size:14px;line-height:1.9}.association-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.association{padding:18px;border:1px solid var(--line);background:white;border-radius:10px}.association small{color:var(--red);font-size:11px}.association h4{margin:10px 0;font-size:15px}.association p{font-size:13px;color:#68778c}.list-tools{display:flex;gap:10px;margin-bottom:15px}.list-tools input{flex:1;min-width:0}.evidence-row{background:white;border:1px solid var(--line);border-radius:9px;margin:10px 0;padding:14px 16px}.evidence-row summary{cursor:pointer;font-size:14px;line-height:1.8;font-weight:500}.evidence-row p{font-size:13px;color:#64738a}.source{display:block;overflow-wrap:anywhere;font-size:12px;color:#446da1;margin:8px 0}.topic-title{font-size:14px;font-weight:600}.row-meta{font-size:11px;color:var(--muted);margin:8px 0}.link-button{padding:5px 0;border:0;background:none;color:#476c9a;font-size:12px}.bar-row{display:grid;grid-template-columns:110px 1fr 55px;align-items:center;gap:14px;margin:14px 0;font-size:13px}.bar-bg{background:#f0f3f8;border-radius:3px;height:9px}.bar{background:#b8485b;border-radius:3px;height:100%}.region-summary{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#68778c;margin:14px 0}.detail-pager{padding:10px 0;border:0}
@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.association-grid{grid-template-columns:1fr}.hero{display:block}.topbar{padding:0 18px}.topbar span{display:none}main{padding:22px 12px}.detail-body,.detail-head{padding:20px}.hide-mobile{display:none}h1{font-size:25px}.filters{padding:14px}.pager{flex-wrap:wrap}td,th{padding:12px 10px}}
</style></head><body>
<div class="topbar"><div class="brand"><em>Lenovo SMB</em>赛道洞察</div><span id="updated"></span></div>
<main><section class="hero"><div><div class="eyebrow">TRACK INSIGHT / 全国范围</div><h1>从产业信号，发现业务方向</h1><p>浏览赛道、了解潜在 IT 关联，追溯支撑事件与原始材料。</p></div><span class="chip">离线可用 · 全量分析结果</span></section>
<section class="metrics" id="metrics"></section>
<div class="notice">候选／观察状态表示证据就绪程度，不是热度或商业价值评分。SMB 关联不代表已确认需求或采购意向；主要区域表示支撑事件的省级信号分布，不等于企业覆盖或市场规模。</div>
<section class="panel"><div class="filters">
<input id="search" aria-label="搜索" placeholder="搜索赛道名称、定义、工作负载或产品服务">
<select id="status" aria-label="状态"><option value="candidate">候选赛道</option><option value="watchlist">观察赛道</option><option value="">全部状态</option></select>
<select id="province" aria-label="省份"><option value="">全部省份</option></select>
<select id="sort" aria-label="排序"><option value="events">支撑事件数 ↓</option><option value="topics">关联 Topic 数 ↓</option><option value="name">赛道名称</option><option value="original">原始编号</option></select>
<button class="btn" id="reset">重置</button></div>
<div class="results-meta"><span id="count"></span><span>点击赛道名称查看详情</span></div>
<div class="table-wrap" id="table"></div><div class="pager"><span id="range"></span><div><select id="page-size" aria-label="每页条数"><option>20</option><option>50</option><option>100</option></select><button class="btn" id="prev">上一页</button><span id="page-info"></span><button class="btn" id="next">下一页</button></div></div></section></main>
<dialog id="detail" aria-labelledby="detail-title"><div class="detail-head"><div class="eyebrow">赛道详情</div><h2 id="detail-title"></h2><div class="detail-meta" id="detail-meta"></div><button class="close" id="close" aria-label="关闭详情">×</button></div>
<nav class="tabs" role="tablist" aria-label="详情分区"><button role="tab" data-tab="overview" aria-selected="true">业务概览</button><button role="tab" data-tab="regions">主要区域</button><button role="tab" data-tab="topics">关联 Topic</button><button role="tab" data-tab="events">支撑事件与来源</button></nav>
<div id="detail-body" class="detail-body" role="tabpanel"></div></dialog>
<script>
const DATA=__DATA__;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=p=>p.replace(/壮族自治区|回族自治区|维吾尔自治区|特别行政区|自治区|省|市/g,'');
let page=1,current=null,tab='overview',detailPage=1,detailQuery='',topicRole='',eventScope='';
const searchIndex=new Map(DATA.tracks.map(t=>[t.index,JSON.stringify([t.name,t.definition,t.associations]).toLowerCase()]));
$('updated').textContent='生成于 '+DATA.generated_at;
$('metrics').innerHTML=[['全部赛道',DATA.tracks.length,'本轮全国范围结果'],['候选赛道',DATA.counts.candidate||0,'具备就绪身份依据'],['观察赛道',DATA.counts.watchlist||0,'仍待补充证据'],['具备省级信号',DATA.tracks.filter(t=>t.localized_events>0).length,'按支撑事件地域统计']].map(([k,n,s])=>`<div class="metric"><small>${k}</small><b>${n}</b><span>${s}</span></div>`).join('');
[...new Set(DATA.tracks.flatMap(t=>t.province_counts.map(p=>p.province)))].sort((a,b)=>a.localeCompare(b,'zh-CN')).forEach(p=>$('province').insertAdjacentHTML('beforeend',`<option value="${esc(p)}">${esc(short(p))}</option>`));
function filtered(){const q=$('search').value.trim().toLowerCase(),s=$('status').value,p=$('province').value,o=$('sort').value;return DATA.tracks.filter(t=>(!s||t.status===s)&&(!p||t.province_counts.some(x=>x.province===p))&&(!q||searchIndex.get(t.index).includes(q))).sort((a,b)=>o==='events'?b.event_count-a.event_count||a.index-b.index:o==='topics'?b.topic_count-a.topic_count||a.index-b.index:o==='name'?a.name.localeCompare(b.name,'zh-CN'):a.index-b.index);}
function render(){const rows=filtered(),size=Number($('page-size').value),pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages);const start=(page-1)*size;
$('count').textContent=`符合条件 ${rows.length} 条 / 全部 ${DATA.tracks.length} 条`;$('range').textContent=rows.length?`显示 ${start+1}–${Math.min(start+size,rows.length)} 条`:'暂无结果';$('page-info').textContent=`${page} / ${pages}`;$('prev').disabled=page===1;$('next').disabled=page===pages;
$('table').innerHTML=rows.length?`<table><thead><tr><th>排名</th><th style="width:37%">赛道</th><th>支撑事件</th><th class="hide-mobile">Topic</th><th>主要信号省份</th><th class="hide-mobile">SMB 关联方向</th><th>状态</th></tr></thead><tbody>${rows.slice(start,start+size).map((t,i)=>`<tr><td class="rank">${start+i+1}</td><td><button class="track-name" data-open="${t.index}">${esc(t.name)}</button><div class="excerpt">${esc(t.definition)}</div></td><td class="number">${t.event_count}</td><td class="hide-mobile">${t.topic_count}</td><td><div class="chips">${t.province_counts.slice(0,3).map(p=>`<span class="chip province" title="${esc(p.province)}：${p.count}条事件">${esc(short(p.province))} ${p.count}</span>`).join('')||`<span class="muted">${t.national_events?'仅全国性信号':'省份待确认'}</span>`}</div></td><td class="hide-mobile"><div class="chips">${[...new Set(t.associations.map(a=>a.product_category))].map(c=>`<span class="chip">${esc(c)}</span>`).join('')||'—'}</div></td><td><span class="badge ${t.status==='watchlist'?'watchlist':''}">${t.status==='candidate'?'候选':'观察'}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有匹配的赛道，请调整搜索或筛选条件。</div>';}
for(const id of ['search','status','province','sort','page-size'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=1;render();});
$('reset').onclick=()=>{$('search').value='';$('status').value='candidate';$('province').value='';$('sort').value='events';page=1;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
$('table').onclick=ev=>{const b=ev.target.closest('[data-open]');if(b)openTrack(Number(b.dataset.open));};$('close').onclick=()=>$('detail').close();$('detail').addEventListener('click',ev=>{if(ev.target===$('detail')){const r=$('detail').getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)$('detail').close();}});
function openTrack(index){current=DATA.tracks.find(t=>t.index===index);tab='overview';detailQuery='';detailPage=1;topicRole='';eventScope='';$('detail-title').textContent=current.name;$('detail-meta').innerHTML=`<span class="badge ${current.status==='watchlist'?'watchlist':''}">${current.status==='candidate'?'候选赛道':'观察赛道'}</span><span>支撑事件 ${current.event_count}</span><span>核心身份事件 ${current.core_event_ids.length}</span><span>Topic ${current.topic_count}</span><span>原始编号 ${current.index}</span>`;detailRender();$('detail').showModal();}
document.querySelector('.tabs').onclick=ev=>{const b=ev.target.closest('[data-tab]');if(b){tab=b.dataset.tab;detailQuery='';detailPage=1;topicRole='';eventScope='';detailRender();}};
function eventHtml(ref,t){const e=DATA.evidence.events[ref];if(!e)return '';return `<details class="evidence-row"><summary>${t.core_event_ids.includes(ref)?'<span class="chip">核心身份</span> ':''}${esc(e.title)}</summary><div class="row-meta">${esc(e.date||'日期未提供')} · ${esc((e.regions||[]).join('、')||'地域未提供')}</div><p>${esc(e.summary)}</p>${e.sources.filter(url=>/^https?:\/\//i.test(url)).map(url=>`<a class="source" href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看原文 · ${esc(url)}</a>`).join('')||'<p>未保存来源链接</p>'}</details>`;}
function topicHtml(ref,t){const topic=DATA.evidence.topics[ref];if(!topic)return '';const role=t.topic_ids.includes(ref)?'核心':'辅助';return `<div class="evidence-row"><div class="topic-title"><span class="chip">${role}</span> ${esc(topic.label)}</div><p>${esc(topic.definition)}</p><button class="link-button" data-topic-events="${esc(ref)}">查看关联的 ${new Set(topic.event_ids).size} 条事件 →</button></div>`;}
function pagerHtml(total){const pages=Math.max(1,Math.ceil(total/10));detailPage=Math.min(detailPage,pages);return `<div class="pager detail-pager"><span>共 ${total} 条 · 每页 10 条</span><div><button class="btn" data-dprev ${detailPage===1?'disabled':''}>上一页</button><span>${detailPage} / ${pages}</span><button class="btn" data-dnext ${detailPage===pages?'disabled':''}>下一页</button></div></div>`;}
let topicEventIds=null,topicEventLabel='';
function detailRender(){const t=current;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));const body=$('detail-body');
if(tab==='overview'){topicEventIds=null;body.innerHTML=`<div class="card"><h3>赛道范围</h3><p class="definition">${esc(t.definition)}</p></div><h3>SMB 潜在关联</h3><div class="association-grid">${t.associations.map(a=>`<article class="association"><small>${esc(a.product_category)}</small><h4>${esc(a.workload)}</h4><p>${esc(a.reason)}</p></article>`).join('')||'<p>未提出具体关联方向。</p>'}</div><p class="muted">以上为经营活动推导的可能方向，不代表实际部署或采购意向。</p><div class="card" style="margin-top:20px"><h3>主要信号省份</h3><div class="chips">${t.province_counts.slice(0,5).map(p=>`<span class="chip">${esc(p.province)} · ${p.count} 条事件</span>`).join('')||'<span class="muted">暂无明确省级信号</span>'}</div><p class="muted">前五位，按去重支撑事件数量排序；完整分布见“主要区域”。</p></div>`;}
else if(tab==='regions'){topicEventIds=null;const max=t.province_counts[0]?.count||1;body.innerHTML=`<div class="card"><h3>省级信号分布</h3><div class="region-summary"><span>可定位省份 ${t.localized_events} 条</span><span>含全国标签 ${t.national_events} 条</span><span>未定位省份 ${t.unmapped_events} 条</span></div>${t.province_counts.map(p=>`<div class="bar-row"><span>${esc(short(p.province))}</span><div class="bar-bg"><div class="bar" style="width:${p.count/max*100}%"></div></div><strong>${p.count}</strong></div>`).join('')||'<p>未取得明确的省级地域信息。</p>'}<p class="muted">仅使用事件已记录的地域标签，不从网页域名或发布机关推测影响地域。同一事件在同一省只计一次；跨省事件可计入多个省份，全国标签单列。未定位包括仅城市／园区标签、海外标签及地域缺失，不代表这些事件没有影响。</p></div>`;}
else{let ids;if(tab==='topics'){topicEventIds=null;ids=[...new Set([...t.topic_ids,...t.supporting_topic_ids])].filter(ref=>{const topic=DATA.evidence.topics[ref];return topic&&(!topicRole||(topicRole==='core')===t.topic_ids.includes(ref))&&JSON.stringify([topic.label,topic.definition]).toLowerCase().includes(detailQuery.toLowerCase());});}else{ids=(topicEventIds||t.event_ids).filter(ref=>{const e=DATA.evidence.events[ref];return e&&(!eventScope||t.core_event_ids.includes(ref))&&JSON.stringify([e.title,e.summary,e.regions]).toLowerCase().includes(detailQuery.toLowerCase());});}
const pager=pagerHtml(ids.length);body.innerHTML=`${topicEventIds?`<p class="muted">当前查看 Topic：${esc(topicEventLabel)} <button class="link-button" data-all-events>返回全部事件</button></p>`:''}<div class="list-tools"><input id="detail-search" aria-label="搜索详情" placeholder="${tab==='topics'?'搜索 Topic 名称或定义':'搜索事件标题、摘要或地域'}" value="${esc(detailQuery)}">${tab==='topics'?`<select id="detail-scope" aria-label="Topic 角色"><option value="">全部 Topic</option><option value="core" ${topicRole==='core'?'selected':''}>核心 Topic</option><option value="support" ${topicRole==='support'?'selected':''}>辅助 Topic</option></select>`:`<select id="detail-scope" aria-label="事件类型"><option value="">全部事件</option><option value="core" ${eventScope?'selected':''}>核心身份事件</option></select>`}</div><div>${ids.slice((detailPage-1)*10,detailPage*10).map(ref=>tab==='topics'?topicHtml(ref,t):eventHtml(ref,t)).join('')||'<div class="empty">没有匹配记录</div>'}</div>${pager}<p class="muted">支撑事件包括辅助信号，并非每条都单独证明赛道身份。数量按事件 ID 去重，不等于独立来源数。</p>`;
$('detail-search').addEventListener('input',ev=>{const pos=ev.target.selectionStart;detailQuery=ev.target.value;detailPage=1;detailRender();$('detail-search').focus();$('detail-search').setSelectionRange(pos,pos);});$('detail-scope').onchange=ev=>{if(tab==='topics')topicRole=ev.target.value;else eventScope=ev.target.value;detailPage=1;detailRender();};}
body.scrollTop=0;}
$('detail-body').onclick=ev=>{if(ev.target.closest('[data-dprev]')){detailPage--;detailRender();}if(ev.target.closest('[data-dnext]')){detailPage++;detailRender();}const b=ev.target.closest('[data-topic-events]');if(b){const topic=DATA.evidence.topics[b.dataset.topicEvents];topicEventIds=[...new Set(topic.event_ids)].sort((a,b)=>(DATA.evidence.events[b]?.date||'').localeCompare(DATA.evidence.events[a]?.date||''));topicEventLabel=topic.label;tab='events';detailPage=1;detailQuery='';eventScope='';detailRender();}if(ev.target.closest('[data-all-events]')){topicEventIds=null;detailPage=1;detailQuery='';detailRender();}};
render();
</script></body></html>
