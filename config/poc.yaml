version: agent-poc-v1
scope:
  regions: [北京市]
  industry_scopes: [制造业]
  start_date: 2024-09-16
  end_date: 2026-09-16
bailian:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3.7-flash
  review_batch_size: 10
  timeout_seconds: 120
  max_retries: 2
  max_concurrency: 1
budgets:
  max_work_packages: 8
  max_searches_per_work_package: 8
  max_candidates_per_work_package: 100
coverage:
  required_source_classes:
    - government
    - park
    - association
    - company
    - industry_media
    - authoritative_media
  dominant_domain_warning_ratio: 0.4
prompts:
  planning: config/prompts/planning_v1.md
  search_review: config/prompts/search_review_v1.md
