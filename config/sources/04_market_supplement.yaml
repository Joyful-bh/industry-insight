- code: beijing_daily
  name: 北京日报客户端与京报网
  publisher: 北京日报报业集团
  source_level: media
  source_type: authoritative_local_media
  regions: [CN-11]
  content_types: [project_progress, investment_financing, business_operation]
  entry_urls:
    - https://www.bjd.com.cn/jbw/news/
    - https://wap.bjd.com.cn/jbw/tech/index.shtml?cid=51
  adapter_key: generic_html_list
  schedule: daily
  discovery_filter:
    enabled: true
    exploration_rate: 0.05
    include_any:
      [专精特新, 小微企业, 中小企业, 独角兽, 融资, 获投, 上市, 并购, 产业集群, 产业园, 开发区, 技术改造, 数字化转型, 智能制造, 科技成果转化, 开工, 投产, 扩建, 产线, 首发, 首试, 首台套, 商业化]
    include_all_groups:
      - [政策, 措施, 规划, 项目, 资金, 补贴, 认定, 试点, 示范, 签约, 落地, 发布, 突破, 增长]
      - [企业, 产业, 工业, 制造, 科技, 软件, 数据, 人工智能, 医药, 医疗器械, 汽车, 机器人, 芯片, 材料, 能源, 商贸, 服务业, 园区]
    exclude_any:
      [天气, 降雨, 雷电, 台风, 体育比赛, 影视, 演出, 教师, 入学, 招生, 养生, 旅游攻略, 美食, 交通事故, 社会案件, 辟谣]
  evidence_usage: 用于补充发现和交叉验证，正式结论优先回溯政府、机构或企业原始披露。

