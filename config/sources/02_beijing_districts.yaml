- code: beijing_dongcheng
  name: 北京市东城区人民政府
  publisher: 北京市东城区人民政府
  source_level: district
  source_type: government_portal
  regions: [CN-11-01]
  content_types: [policy_measure, application_program, recognition_result, project_progress]
  entry_urls:
    - https://www.bjdch.gov.cn/zwgk/
    - https://www.bjdch.gov.cn/ztzl/tzdc/tzzc/qjzc/
  adapter_key: district_portal
  schedule: daily
  discovery_filter: &government_smb_filter
    enabled: true
    exploration_rate: 0.08
    include_any:
      [专精特新, 小微企业, 中小企业, 民营企业, 高新技术企业, 产业集群, 产业园, 开发区, 融资, 贷款贴息, 技术改造, 数字化转型, 智能制造, 科技成果转化, 开工, 投产, 扩建, 招商引资]
    include_all_groups:
      - [政策, 措施, 规划, 申报, 征集, 认定, 公示, 名单, 项目, 资金, 补贴, 奖励, 试点, 示范, 签约, 落地]
      - [企业, 产业, 工业, 制造, 科技, 商务, 商贸, 软件, 信息, 数据, 人工智能, 医药, 汽车, 机器人, 材料, 能源, 园区, 市场主体]
    exclude_any:
      [入学, 招生, 学区, 养老, 婚姻, 户籍, 疫苗, 就医, 医保报销, 天气, 道路封闭, 停水, 停电, 垃圾分类, 物业, 公租房, 征地补偿, 事业单位招聘, 公务员招考, 劳动仲裁, 行政处罚决定书]

