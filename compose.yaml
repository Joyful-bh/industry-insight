name: track-insight

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: track_insight
      POSTGRES_USER: track_insight
      POSTGRES_PASSWORD: track_insight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track_insight -d track_insight"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
